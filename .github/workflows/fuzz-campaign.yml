name: Fuzz Campaign

on:
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: >
          Seconds per fuzz target. Short runs find shallow bugs;
          longer runs (300–600 s) find deeper ones.
        required: false
        default: '60'
      packages:
        description: >
          Go import path pattern(s) for packages to fuzz, space-separated.
          Default: all packages with Fuzz* targets.
        required: false
        default: './...'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run fuzz campaign
        id: fuzz
        env:
          FUZZ_SECONDS_INPUT: ${{ inputs.fuzz_time }}
          FUZZ_PACKAGES_INPUT: ${{ inputs.packages }}
          GOMAXPROCS: '4'
        run: python3 scripts/run_fuzz_workflow.py
        continue-on-error: true
      - name: Collect crashers
        if: always()
        run: |
          find . -path '*/testdata/fuzz/*/*' -type f -not -path '*/.git/*' \
            -print > "$RUNNER_TEMP/fuzz-reproducers.txt"
          if [ -s "$RUNNER_TEMP/fuzz-reproducers.txt" ]; then
            echo "Fuzz reproducers (including committed seeds):"
            cat "$RUNNER_TEMP/fuzz-reproducers.txt"
          else
            echo "No new seeds found."
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuzz-campaign-results
          retention-days: 30
          path: |
            ${{ runner.temp }}/fuzz-cache/
            ${{ runner.temp }}/fuzz-reproducers.txt
            **/testdata/fuzz/**
      - name: Report outcome
        if: steps.fuzz.outcome == 'failure'
        run: |
          echo "::error::Fuzz campaign failed; inspect its logs for a finding or infrastructure error."
          echo "Retrieve 'fuzz-campaign-results' for retained coverage inputs and failure reproducers."
          exit 1
