name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      github.event.action != 'converted_to_draft' &&
      'draft' || 'full'
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test packaging contracts without building binaries
        run: python -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Test staged-analysis consumer contracts
        run: python examples/staged_analysis/test_route.py -v
      - name: Test compatibility receipt verification
        run: |
          python -m unittest discover -s tests/compatibility_next -p 'test_*.py' -v
          python -m unittest discover -s tests/compatibility_v060 -p 'test_*.py' -v
      - name: Test graph evidence and resource failure checks
        run: |
          python -m unittest discover -s tests/projects/graph -p 'test_*.py' -v
          python -m unittest discover -s tests/resources -p 'test_*.py' -v
          python -m unittest discover -s tests/bench -p 'test_*.py' -v
      - name: Test optional proof-evidence validation without Bend
        run: python -m unittest discover -s research/bend-aggregation -p 'test_*.py' -v
      - name: Test performance baseline identity checks
        run: python -m unittest discover -s tests/performance/bounded_reader -p 'test_*.py' -v
      - name: Test focused-analysis receipt contracts
        run: python -m unittest discover -s tests/focus_v070 -p 'test_*.py' -v
      - name: Test context evidence receipt contracts
        run: python -m unittest discover -s tests/context_v080 -p 'test_*.py' -v
      - name: Test atlas classification and map quality harnesses
        run: |
          python -m unittest discover -s tests/atlas -p 'test_*.py' -v
          python -m unittest discover -s tests/map_corpus -p 'test_*.py' -v
          python -m unittest discover -s tests/map_corpus/review_holdout -p 'test_*.py' -v
      - name: Test workflow concurrency contracts
        run: python -m unittest discover -s tests/ci -p 'test_*.py' -v
      - name: Test evidence archive manifest (no network)
        run: |
          python -m unittest discover -s tests/receipts -p 'test_evidence_archive.py' -v
          python -m unittest discover -s tests/receipts -p 'test_fetch_receipts.py' -v

  test:
    needs: preflight
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: go vet ./...
      - name: Keep network transports out of the linked binary
        run: sh scripts/check-linked-deps.sh
      - name: Verify a clean versioned Go module install
        # A file:// module proxy needs a drive-letter URL on Windows; the
        # install path itself is platform-independent and is verified on
        # Linux and macOS.
        if: runner.os != 'Windows'
        run: sh scripts/check-clean-install.sh
      - name: Audit Go dependencies for known reachable vulnerabilities
        if: runner.os == 'Linux'
        run: |
          GOBIN="$RUNNER_TEMP/govulncheck" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$RUNNER_TEMP/govulncheck/govulncheck" ./...
      - run: go test -race ./...
      - run: go test ./...
      - run: go build -trimpath -o bin/ .
      - name: Run offline core release smokes against a stamped binary
        if: runner.os == 'Linux'
        run: make release-smoke
        env:
          CGO_ENABLED: '0'
      - name: Cross-compile for Windows, Linux/arm64 and Darwin/amd64
        if: runner.os == 'Linux'
        run: |
          GOOS=windows   CGO_ENABLED=0 go build -trimpath ./...
          GOOS=windows   CGO_ENABLED=0 go vet ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath ./...
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath ./...
      - name: staticcheck (Linux only)
        if: runner.os == 'Linux'
        run: |
          GOBIN="$RUNNER_TEMP/staticcheck" CGO_ENABLED=0 go install honnef.co/go/tools/cmd/staticcheck@v0.6.0
          # Exclude embedded upstream code: the jsonschema snapshot, third_party
          # forks and the vendored scc processor.
          go list ./... | grep -v -E 'dircue/internal/jsonschema|/third_party/|/internal/sccprocessor' | xargs "$RUNNER_TEMP/staticcheck/staticcheck"
      - name: Coverage summary (Linux only)
        if: runner.os == 'Linux'
        run: |
          go test -coverprofile="$RUNNER_TEMP/coverage.out" ./... -count=1 | tee "$RUNNER_TEMP/cover-run.txt"
          {
            echo '## Per-package test coverage'
            echo '```'
            grep '^ok\b' "$RUNNER_TEMP/cover-run.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          retention-days: 7
          name: coverage-profile
          path: ${{ runner.temp }}/coverage.out
      - name: Ergonomics regression tests (Linux only)
        if: runner.os == 'Linux'
        run: |
          for id in R-001 R-002 R-003 R-004 R-005 R-006 R-007 R-008 R-009 R-010 R-011; do
            python3 "tests/ergonomics_v100/audit/regression_tests/${id}__contract.test.py" bin/dircue
          done
      - name: Verify one-shot map golden and metamorphic gates
        run: |
          python3 tests/map_corpus/run.py --binary bin/dircue${{ runner.os == 'Windows' && '.exe' || '' }} --output .cache/map-corpus
          python3 tests/map_corpus/verify.py --results .cache/map-corpus
          python3 tests/map_corpus/metamorphic.py --binary bin/dircue${{ runner.os == 'Windows' && '.exe' || '' }}
          python3 tests/map_corpus/robustness.py --binary bin/dircue${{ runner.os == 'Windows' && '.exe' || '' }}
          python3 tests/receipts/test_map_fence.py --binary bin/dircue${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Test staged-analysis consumer against the built CLI
        run: python examples/staged_analysis/test_route.py --candidate bin/dircue${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Hostile-filesystem conformance (quick, POSIX only)
        if: runner.os != 'Windows'
        run: python3 tests/hostile_fs/run.py --binary bin/dircue --quick
      - name: Forest E2E conformance (quick, POSIX only)
        if: runner.os != 'Windows'
        run: python3 tests/forest/run.py --binary bin/dircue${{ runner.os == 'Windows' && '.exe' || '' }} --quick

  linguist-conformance:
    needs: preflight
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: make conformance
      - run: make samples
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 7
          name: linguist-conformance
          path: tests/conformance/results/

  metrics-conformance:
    needs: preflight
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go build -trimpath -o bin/dircue .
        env:
          CGO_ENABLED: '0'
      - name: Compare full-file counters with pinned scc
        run: |
          mkdir -p "$RUNNER_TEMP/dircue-metrics"
          GOBIN="$RUNNER_TEMP/dircue-metrics" CGO_ENABLED=0 go install github.com/boyter/scc/v4@v4.1.0
          python3 tests/metrics/run.py --candidate bin/dircue --scc "$RUNNER_TEMP/dircue-metrics/scc" --output .cache/metrics-differential.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 7
          name: metrics-conformance
          path: .cache/metrics-differential.json

  counter-regression:
    # Report-only PR check: map the corpus fixtures with the base and head
    # builds and compare their deterministic cost counters in the job summary.
    # Wall time, heap and GC counts vary between runs and are never compared.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build head and base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o "$RUNNER_TEMP/dircue-head" .
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/base" && go build -trimpath -o "$RUNNER_TEMP/dircue-base" .)
      - name: Compare deterministic cost counters
        run: |
          python3 tests/bench/counter_compare.py \
            --base "$RUNNER_TEMP/dircue-base" --head "$RUNNER_TEMP/dircue-head" \
            tests/map_corpus/fixtures/*/

  map-diff-dogfood:
    # Self-test: exercise the map-diff action against this repository using the
    # binary built from the PR branch. No release download; no PR comment.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required for merge-base calculation inside the action.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build dircue
        run: go build -trimpath -o bin/dircue .
        env:
          CGO_ENABLED: '0'
      - name: dircue map diff (self-test)
        uses: ./.github/actions/map-diff
        with:
          dircue-binary: bin/dircue
          source-mode: auto
          post-comment: 'false'
