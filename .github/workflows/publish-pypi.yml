name: Publish verified wheels to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published GitHub Release version without v, such as 1.0.0'
        required: true
        type: string

concurrency:
  group: pypi-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    if: github.repository == 'war-and-code/dircue' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve the annotated release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$RELEASE_VERSION" <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import wheels
          if wheels.python_version(sys.argv[1]) != sys.argv[1]:
              raise SystemExit('PyPI publication requires a final X.Y.Z version')
          PY
          tag="v${RELEASE_VERSION}"
          test "$(git cat-file -t "refs/tags/${tag}")" = tag
          commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          git merge-base --is-ancestor "$commit" "$GITHUB_SHA"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          python - "$RUNNER_TEMP/release.json" "$tag" <<'PY'
          import json, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if release != {'tagName': sys.argv[2], 'isDraft': False, 'isPrerelease': False}:
              raise SystemExit('tag must have a published, non-prerelease GitHub Release')
          PY
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Download the exact release wheels and signed manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pypi
          gh release download "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" \
            --dir dist/pypi \
            --pattern "dircue-${RELEASE_VERSION}-py3-none-*.whl" \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.sigstore.json \
            --pattern release-candidate.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify release workflow attestations and signed checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/pypi/*.whl dist/pypi/SHA256SUMS dist/pypi/release-candidate.json; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow war-and-code/dircue/.github/workflows/release-candidate.yml \
              --source-ref refs/heads/main \
              --source-digest "$RELEASE_COMMIT"
          done
          cosign verify-blob \
            --bundle dist/pypi/SHA256SUMS.sigstore.json \
            --certificate-identity 'https://github.com/war-and-code/dircue/.github/workflows/release-candidate.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/pypi/SHA256SUMS
      - name: Verify wheel metadata, contents, source, and checksums
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: python scripts/pypi_release.py --directory dist/pypi --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
      - name: Install and run the Linux release wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/dircue-wheel-check"
          "$RUNNER_TEMP/dircue-wheel-check/bin/python" -m pip install --no-index \
            "dist/pypi/dircue-${RELEASE_VERSION}-py3-none-manylinux_2_17_x86_64.whl"
          test "$("$RUNNER_TEMP/dircue-wheel-check/bin/dircue" --version)" = "dircue ${RELEASE_VERSION}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-pypi-wheels
          path: dist/pypi/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-pypi-wheels
          path: dist/pypi
      - name: Recheck transferred wheel hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import os
          import re
          root = Path('dist/pypi')
          version = os.environ['RELEASE_VERSION']
          wheels = sorted(root.glob('*.whl'))
          if len(wheels) != 7 or any(not re.fullmatch(r'dircue-' + re.escape(version) + r'-py3-none-[a-z0-9_]+\.whl', p.name) for p in wheels):
              raise SystemExit('wheel inventory changed between verification and publication')
          checksums = {}
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split('  ', 1)
              checksums[name] = digest
          for wheel in wheels:
              if hashlib.sha256(wheel.read_bytes()).hexdigest() != checksums.get(wheel.name):
                  raise SystemExit(f'wheel changed between verification and publication: {wheel.name}')
          PY
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.2'
          enable-cache: false
      - name: Publish only the verified wheel files
        shell: bash
        run: uv publish --publish-url https://upload.pypi.org/legacy/ --trusted-publishing always dist/pypi/*.whl

  install-smoke:
    needs: publish
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.2'
          enable-cache: false
      - name: Install from public PyPI in a fresh environment
        run: |
          set -euo pipefail
          mkdir smoke
          cd smoke
          cat > pyproject.toml <<EOF
          [project]
          name = "dircue-pypi-install-smoke"
          version = "0.0.0"
          requires-python = ">=3.10"
          dependencies = ["dircue==${RELEASE_VERSION}"]
          EOF
          uv sync --no-cache --no-config
          actual="$(uv run --locked --no-config dircue --version)"
          test "$actual" = "dircue ${RELEASE_VERSION}"
          actual="$(uvx --no-cache --no-config --from "dircue==${RELEASE_VERSION}" dircue --version)"
          test "$actual" = "dircue ${RELEASE_VERSION}"
