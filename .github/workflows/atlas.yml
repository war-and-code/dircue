name: Atlas

on:
  workflow_dispatch:
    inputs:
      subset:
        description: 'Which corpus subset to run: "smoke" (default, 5 repos) or "full" (all repos)'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      release_tag:
        description: 'Optional release tag to attach results as release assets (e.g. v1.0.0). Leave empty to skip.'
        required: false
        default: ''
        type: string
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - 'tests/atlas/**'

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            third_party/go-enry/go.sum
            third_party/go-git/go.sum

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build dircue
        run: go build -trimpath -o bin/dircue .
        env:
          CGO_ENABLED: '0'

      - name: Install pinned scc 4.1.0
        run: |
          mkdir -p "$RUNNER_TEMP/dircue-scc"
          GOBIN="$RUNNER_TEMP/dircue-scc" CGO_ENABLED=0 go install github.com/boyter/scc/v4@v4.1.0
          echo "SCC=$RUNNER_TEMP/dircue-scc/scc" >> "$GITHUB_ENV"

      - name: Run Python unit tests for atlas harness
        run: python3 -m unittest tests/atlas/test_classify.py tests/atlas/test_accuracy.py -v

      - name: Determine subset
        id: subset
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.subset || 'smoke' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch corpus (smoke subset)
        if: steps.subset.outputs.mode == 'smoke'
        run: python3 tests/atlas/fetch.py --cache "$RUNNER_TEMP/atlas-cache" --smoke

      - name: Fetch corpus (full)
        if: steps.subset.outputs.mode == 'full'
        run: python3 tests/atlas/fetch.py --cache "$RUNNER_TEMP/atlas-cache" --all

      - name: Run atlas (smoke)
        if: steps.subset.outputs.mode == 'smoke'
        run: |
          python3 tests/atlas/run.py \
            --candidate bin/dircue \
            --scc "$SCC" \
            --cache "$RUNNER_TEMP/atlas-cache" \
            --output .cache/atlas \
            --smoke \
            --no-linguist

      - name: Run atlas (full)
        if: steps.subset.outputs.mode == 'full'
        run: |
          python3 tests/atlas/run.py \
            --candidate bin/dircue \
            --scc "$SCC" \
            --cache "$RUNNER_TEMP/atlas-cache" \
            --output .cache/atlas \
            --all \
            --no-linguist

      - name: Upload atlas results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 7
          name: atlas-results-${{ steps.subset.outputs.mode }}
          path: .cache/atlas/

      - name: Attach results as release assets
        if: github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.release_tag }}"
          for f in .cache/atlas/atlas-results.jsonl .cache/atlas/atlas-summary.md; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --clobber || true
          done
