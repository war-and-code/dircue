name: Structural prototype

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prototype:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            third_party/go-enry/go.sum
            third_party/go-git/go.sum
            prototypes/structural/driver/go.mod
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Cache Rust dependencies, crate sources, and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git
            prototypes/structural/worker/target
          key: rust-structural-prototype-v1-${{ matrix.os }}-${{ runner.arch }}-native-1.94.0-${{ hashFiles('prototypes/structural/worker/Cargo.lock', 'prototypes/structural/worker/Cargo.toml', '.cargo/config.toml', 'prototypes/structural/worker/.cargo/config.toml') }}
          restore-keys: |
            rust-structural-prototype-v1-${{ matrix.os }}-${{ runner.arch }}-native-1.94.0-
      - name: Test worker
        run: cargo +1.94.0 test --locked --manifest-path prototypes/structural/worker/Cargo.toml
      - name: Test driver
        working-directory: prototypes/structural/driver
        run: |
          go vet ./...
          go test -race ./...
      - name: Build prototype
        run: make -C prototypes/structural build CARGO='cargo +1.94.0'
      - name: Validate both consumers and process boundaries
        run: >-
          python3 prototypes/structural/tests/validate.py
          --worker prototypes/structural/worker/target/release/dircue-structural-worker
          --driver prototypes/structural/bin/dircue-structural-prototype
          --output prototypes/structural/tests/results/ci-validation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 7
          name: structural-prototype-${{ matrix.os }}
          path: prototypes/structural/tests/results/ci-validation.json
