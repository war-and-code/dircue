name: Syft Oracle

# Validates that dircue correctly integrates a Syft JSON report and reflects
# it in the packages coverage question. The fixture is pre-generated and
# committed; no network access is required at run time.
#
# To regenerate the fixture with a real Syft run (requires Docker + network):
#   docker run --rm \
#     -v "$PWD/tests/compatibility_next/composition/fixture:/src" \
#     anchore/syft:1.20.0 scan /src -o json \
#     > tests/syft-oracle/fixtures/composition-syft.json
#
# This is an independent oracle that complements the Linguist and scc oracles:
#   Linguist 9.7.0 → linguist-conformance job (push/PR)
#   scc 4.1.0      → metrics-conformance job (push/PR)
#   Syft 1.x       → this workflow (workflow_dispatch only)
on:
  workflow_dispatch:
    inputs:
      binary_variant:
        description: >
          Which binary to test. Use 'release' to test a released tarball
          (downloaded from the latest release). Default 'build' builds from
          source.
        required: false
        default: 'build'

permissions:
  contents: read

jobs:
  syft-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            third_party/go-enry/go.sum
            third_party/go-git/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build dircue
        run: go build -trimpath -o bin/dircue .
        env:
          CGO_ENABLED: '0'
      - name: Validate Syft fixture format
        run: |
          python3 -c "
          import json, sys
          with open('tests/syft-oracle/fixtures/composition-syft.json') as f:
              d = json.load(f)
          required = ('schema', 'descriptor', 'artifacts', 'artifactRelationships', 'source', 'distro')
          for field in required:
              assert field in d, f'missing field: {field}'
          assert d['descriptor']['name'] == 'syft', 'descriptor.name must be syft'
          assert d['schema']['version'] == '16.1.10', f\"schema.version must be 16.1.10, got {d['schema']['version']}\"
          print(f\"Fixture valid: {len(d['artifacts'])} artifact(s), schema {d['schema']['version']}\")
          "
      - name: Run Syft oracle
        run: |
          python3 tests/syft-oracle/run.py --binary bin/dircue
      - name: Upload oracle results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syft-oracle-results
          retention-days: 7
          path: |
            tests/syft-oracle/fixtures/
