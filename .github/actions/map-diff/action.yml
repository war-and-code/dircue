name: dircue map diff
description: >
  Build a dircue map of the PR base and head, compare them, and write a concise
  architecture-change summary to $GITHUB_STEP_SUMMARY. Optionally posts a PR
  comment when the caller opts in and supplies a token with write access.
  dircue never contacts the network and never executes repository content.

inputs:
  dircue-version:
    description: >
      dircue release tag to download, e.g. "v1.0.0". Defaults to "latest",
      which resolves to the most recent GitHub release. Pin a version for
      reproducible runs.
    required: false
    default: latest

  base-ref:
    description: >
      Git ref to treat as the comparison base. Defaults to the merge-base of
      the PR head with the target branch. Pass an explicit SHA or ref to
      override.
    required: false
    default: ''

  source-mode:
    description: >
      Source mode passed to `dircue map`. One of "auto" (default, uses the
      committed Git tree) or "directory" (maps the working tree including
      uncommitted changes).
    required: false
    default: auto

  post-comment:
    description: >
      Set to "true" to post the summary as a pull-request comment. The caller's
      workflow must supply `github-token` and grant `pull-requests: write`.
      Defaults to "false".
    required: false
    default: 'false'

  github-token:
    description: >
      Personal access token or ${{ secrets.GITHUB_TOKEN }} used when
      post-comment is "true". Must have `pull-requests: write`. Never used for
      any other purpose.
    required: false
    default: ''

  extra-map-flags:
    description: >
      Additional flags forwarded verbatim to `dircue map`, e.g.
      "--attach syft-report.json". Leave empty for the default map.
    required: false
    default: ''

outputs:
  base-map:
    description: Path to the saved base map JSON file.
    value: ${{ steps.map-base.outputs.path }}
  head-map:
    description: Path to the saved head map JSON file.
    value: ${{ steps.map-head.outputs.path }}
  comparison:
    description: Path to the saved map-compare JSON file.
    value: ${{ steps.compare.outputs.path }}
  status:
    description: Comparison status from dircue map compare (changed, unchanged, indeterminate).
    value: ${{ steps.compare.outputs.status }}

runs:
  using: composite
  steps:
    # ── 1. Resolve the dircue release to download ──────────────────────────
    - name: Resolve dircue version
      id: resolve-version
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.dircue-version }}"
        if [ "$version" = "latest" ]; then
          version="$(curl -fsSL --retry 3 \
            https://api.github.com/repos/war-and-code/dircue/releases/latest \
            | grep '"tag_name"' | head -1 | sed 's/.*"tag_name": "\(.*\)".*/\1/')"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # ── 2. Install dircue ───────────────────────────────────────────────────
    - name: Install dircue
      id: install
      shell: bash
      run: |
        set -euo pipefail
        version="${{ steps.resolve-version.outputs.version }}"
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        arch="$(uname -m)"
        case "$arch" in
          x86_64)  arch="amd64" ;;
          aarch64) arch="arm64" ;;
          arm64)   arch="arm64" ;;
          *)       echo "Unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        asset="dircue_${version}_${os}_${arch}.tar.gz"
        url="https://github.com/war-and-code/dircue/releases/download/${version}/${asset}"
        dest="${RUNNER_TEMP}/dircue-install"
        mkdir -p "$dest"
        curl -fsSL --retry 3 -o "${dest}/${asset}" "$url"
        # Verify the checksum published alongside the release.
        checksum_url="${url%.tar.gz}.sha256"
        curl -fsSL --retry 3 -o "${dest}/checksum.txt" "$checksum_url"
        cd "$dest"
        sha256sum -c checksum.txt
        tar -xzf "$asset" -C "$dest"
        chmod +x "${dest}/dircue"
        echo "${dest}" >> "$GITHUB_PATH"
        echo "bin=${dest}/dircue" >> "$GITHUB_OUTPUT"

    # ── 3. Determine base ref ──────────────────────────────────────────────
    - name: Resolve base ref
      id: base-ref
      shell: bash
      run: |
        set -euo pipefail
        base="${{ inputs.base-ref }}"
        if [ -z "$base" ]; then
          # Use the merge base of the PR head and the target branch.
          base="$(git merge-base HEAD "origin/${{ github.base_ref }}" 2>/dev/null || true)"
          if [ -z "$base" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          fi
        fi
        echo "ref=$base" >> "$GITHUB_OUTPUT"

    # ── 4. Map the base checkout ───────────────────────────────────────────
    - name: Map base
      id: map-base
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/dircue-map-base.json"
        git checkout --detach "${{ steps.base-ref.outputs.ref }}" -- 2>/dev/null || \
          git checkout "${{ steps.base-ref.outputs.ref }}" 2>/dev/null
        # shellcheck disable=SC2086
        dircue map --source "${{ inputs.source-mode }}" --json ${{ inputs.extra-map-flags }} . > "$out"
        git checkout - 2>/dev/null || true
        echo "path=$out" >> "$GITHUB_OUTPUT"

    # ── 5. Map the head checkout ───────────────────────────────────────────
    - name: Map head
      id: map-head
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/dircue-map-head.json"
        # shellcheck disable=SC2086
        dircue map --source "${{ inputs.source-mode }}" --json ${{ inputs.extra-map-flags }} . > "$out"
        echo "path=$out" >> "$GITHUB_OUTPUT"

    # ── 6. Compare ────────────────────────────────────────────────────────
    - name: Compare maps
      id: compare
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/dircue-map-compare.json"
        dircue map compare --json \
          "${{ steps.map-base.outputs.path }}" \
          "${{ steps.map-head.outputs.path }}" > "$out"
        status="$(jq -r '.status' "$out")"
        echo "path=$out" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    # ── 7. Render summary ─────────────────────────────────────────────────
    - name: Render step summary
      shell: bash
      run: |
        set -euo pipefail
        dircue map compare --format markdown \
          "${{ steps.map-base.outputs.path }}" \
          "${{ steps.map-head.outputs.path }}" >> "$GITHUB_STEP_SUMMARY"

    # ── 8. Optional PR comment ────────────────────────────────────────────
    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # Render the summary into a temporary file so the gh CLI can post it.
        summary_file="${RUNNER_TEMP}/dircue-map-diff-comment.md"
        dircue map compare --format markdown \
          "${{ steps.map-base.outputs.path }}" \
          "${{ steps.map-head.outputs.path }}" > "$summary_file"
        pr_number="${{ github.event.pull_request.number }}"
        repo="${{ github.repository }}"
        # Look for an existing comment from a prior run on this PR to update.
        existing_id="$(gh api "repos/${repo}/issues/${pr_number}/comments" \
          --jq '.[] | select(.body | startswith("## Architecture diff:")) | .id' \
          | head -1 || true)"
        if [ -n "$existing_id" ]; then
          gh api "repos/${repo}/issues/comments/${existing_id}" \
            -X PATCH -f body="$(cat "$summary_file")"
        else
          gh pr comment "$pr_number" --repo "$repo" --body-file "$summary_file"
        fi
