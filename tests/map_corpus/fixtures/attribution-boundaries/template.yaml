AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  EscapeFunction:
    Type: AWS::Serverless::Function
    Properties:
      # CodeUri: ".." from the repository root resolves to ".." — outside the repository.
      # dircue must not attribute this to the root component.
      CodeUri: ..
      Handler: main
      Runtime: go1.x
