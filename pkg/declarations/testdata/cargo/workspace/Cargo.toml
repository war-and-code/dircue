[workspace]
members = ["crates/app"]
exclude = ["crates/ignored"]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "1.2.3"
edition = "2021"
rust-version = "1.70"

[workspace.dependencies]
common = { path = "crates/common", features = ["base"], default-features = false }
